<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title> शंभु - ABCD, बाराखडी, १-१००</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #FFF9E6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #FF6B6B;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      flex-wrap: wrap;
      gap: 6px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #FFE66D;
      border: none;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4ECDC4;
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
    }
    .color-dot.selected {
      transform: scale(1.2);
      border-color: #333;
    }
    .action-btn {
      background: white;
      border: none;
      padding: 7px 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #barakhadi-bar {
      display: none;
      background: #FFE66D;
      padding: 6px;
      overflow-x: auto;
      white-space: nowrap;
      touch-action: pan-x;
    }
    .consonant-btn {
      background: white;
      border: 2px solid #FF6B6B;
      border-radius: 10px;
      padding: 5px 11px;
      font-size: 17px;
      font-weight: bold;
      margin-right: 5px;
    }
    .consonant-btn.active {
      background: #FF6B6B;
      color: white;
    }
    #info-banner {
      background: #FFFFFF;
      margin: 8px 16px 0;
      padding: 8px 16px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      min-height: 64px;
    }
    #info-pic {
      font-size: 42px;
      line-height: 1;
    }
    #info-text {
      font-size: 26px;
      font-weight: bold;
      color: #222;
    }
    main {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px 14px;
    }
    canvas {
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #4ECDC4;
      color: white;
      border: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 10;
    }
    #prev-btn { left: 24px; }
    #next-btn { right: 24px; }
  </style>
</head>
<body>

<header>
  <div class="tabs">
    <button class="tab-btn active" onclick="setMode('abcd', this)">ABCD</button>
    <button class="tab-btn active" onclick="setMode('ABCD', this)">abcd</button>
    <button class="tab-btn" onclick="setMode('swar', this)">स्वर</button>
    <button class="tab-btn" onclick="setMode('barakhadi', this)">बाराखडी</button>
    <button class="tab-btn" onclick="setMode('marathi_num', this)">१-१००</button>
    <button class="tab-btn" onclick="setMode('eng_num', this)">1-100</button>
  </div>
  <div class="tools">
    <div class="color-dot selected" style="background: #FF3B30;" onclick="setColor('#FF3B30', this)"></div>
    <div class="color-dot" style="background: #007AFF;" onclick="setColor('#007AFF', this)"></div>
    <div class="color-dot" style="background: #34C759;" onclick="setColor('#34C759', this)"></div>
    <div class="color-dot" style="background: #AF52DE;" onclick="setColor('#AF52DE', this)"></div>
    <button class="action-btn" onclick="clearCanvas()">पुसा</button>
  </div>
</header>

<div id="barakhadi-bar"></div>

<div id="info-banner" onclick="speakCurrent()">
  <span id="info-pic">🍎</span>
  <span id="info-text">A for Apple</span>
</div>

<main>
  <button id="prev-btn" class="nav-btn" onclick="prevItem()">&#8249;</button>
  <canvas id="board"></canvas>
  <button id="next-btn" class="nav-btn" onclick="nextItem()">&#8250;</button>
</main>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const abcdData = [
    { char: 'A', word: 'Apple', pic: '🍎', speech: 'A for Apple' },
    { char: 'B', word: 'Ball', pic: '⚽', speech: 'B for Ball' },
    { char: 'C', word: 'Cat', pic: '🐱', speech: 'C for Cat' },
    { char: 'D', word: 'Dog', pic: '🐶', speech: 'D for Dog' },
    { char: 'E', word: 'Elephant', pic: '🐘', speech: 'E for Elephant' },
    { char: 'F', word: 'Fish', pic: '🐟', speech: 'F for Fish' },
    { char: 'G', word: 'Grapes', pic: '🍇', speech: 'G for Grapes' },
    { char: 'H', word: 'Hen', pic: '🐔', speech: 'H for Hen' },
    { char: 'I', word: 'Ice cream', pic: '🍨', speech: 'I for Ice cream' },
    { char: 'J', word: 'Joker', pic: '🃏', speech: 'J for Joker' },
    { char: 'K', word: 'Kite', pic: '🪁', speech: 'K for Kite' },
    { char: 'L', word: 'Lion', pic: '🦁', speech: 'L for Lion' },
    { char: 'M', word: 'Mango', pic: '🥭', speech: 'M for Mango' },
    { char: 'N', word: 'Nest', pic: '🪺', speech: 'N for Nest' },
    { char: 'O', word: 'Orange', pic: '🍊', speech: 'O for Orange' },
    { char: 'P', word: 'Parrot', pic: '🦜', speech: 'P for Parrot' },
    { char: 'Q', word: 'Queen', pic: '👑', speech: 'Q for Queen' },
    { char: 'R', word: 'Rabbit', pic: '🐰', speech: 'R for Rabbit' },
    { char: 'S', word: 'Sun', pic: '☀️', speech: 'S for Sun' },
    { char: 'T', word: 'Tiger', pic: '🐯', speech: 'T for Tiger' },
    { char: 'U', word: 'Umbrella', pic: '☂️', speech: 'U for Umbrella' },
    { char: 'V', word: 'Van', pic: '🚐', speech: 'V for Van' },
    { char: 'W', word: 'Watch', pic: '⌚', speech: 'W for Watch' },
    { char: 'X', word: 'Xylophone', pic: '🎹', speech: 'X for Xylophone' },
    { char: 'Y', word: 'Yak', pic: '🐂', speech: 'Y for Yak' },
    { char: 'Z', word: 'Zebra', pic: '🦓', speech: 'Z for Zebra' }
  ];

  const swarData = [
    { char: 'अ', word: 'अननस', pic: '🍍', speech: 'अ अ अननस' },
    { char: 'आ', word: 'आई', pic: '👩', speech: 'आ आ आई' },
    { char: 'इ', word: 'इमारत', pic: '🏢', speech: 'इ इ इमारत' },
    { char: 'ई', word: 'ईडलिंबू', pic: '🍋', speech: 'ई ई ईडलिंबू' },
    { char: 'उ', word: 'उंट', pic: '🐪', speech: 'उ उ उंट' },
    { char: 'ऊ', word: 'ऊस', pic: '🎋', speech: 'ऊ ऊ ऊस' },
    { char: 'ऋ', word: 'ऋषी', pic: '🧘', speech: 'ऋ ऋऋषी' },
    { char: 'ए', word: 'एडका', pic: '🐐', speech: 'ए ए एडका' },
    { char: 'ऐ', word: 'ऐरण', pic: '🔨', speech: 'ऐ ऐ ऐरण' },
    { char: 'ओ', word: 'ओठा', pic: '👄', speech: 'ओ ओ ओठा' },
    { char: 'औ', word: 'औषध', pic: '💊', speech: 'औ औऔषध' },
    { char: 'अं', word: 'अंगठी', pic: '💍', speech: 'अं अंअंगठी' },
    { char: 'अः', word: 'अः', pic: '✨', speech: 'अः अः' }
  ];

  const vyanjanPics = {
    'क': ['कमळ', '🪷'], 'ख': ['खडू', '🖍️'], 'ग': ['गणपती', '🐘'], 'घ': ['घर', '🏠'],
    'च': ['चमचा', '🥄'], 'छ': ['छत्री', '☂️'], 'ज': ['जहाज', '🚢'], 'झ': ['झेंडा', '🚩'],
    'ट': ['टोपली', '🧺'], 'ठ': ['ठसा', '👣'], 'ड': ['डमरू', '🥁'], 'ढ': ['ढग', '☁️'],
    'ण': ['बाण', '🏹'], 'त': ['तलवार', '⚔️'], 'थ': ['थवा', '🐦'], 'द': ['दप्तर', '🎒'],
    'ध': ['धनुष्य', '🏹'], 'न': ['नळ', '🚰'], 'प': ['पतंग', '🪁'], 'फ': ['फणस', '🍈'],
    'ब': ['बदक', '🦆'], 'भ': ['भोपळा', '🎃'], 'म': ['मगर', '🐊'], 'य': ['यज्ञ', '🔥'],
    'र': ['रथ', ' chariot'.trim()], 'ल': ['लसूण', '🧄'], 'व': ['वडा', '🍩'], 'श': ['शंख', '🐚'],
    'ष': ['षटकोन', ' Hex'.trim()], 'स': ['ससा', '🐇'], 'ह': ['हत्ती', '🐘'], 'ळ': ['बाळ', '👶'],
    'क्ष': ['क्षत्रिय', '🛡️'], 'ज्ञ': ['ज्ञान', '📚']
  };

  const vyanjanList = Object.keys(vyanjanPics);
  const matras = ["", "ा", "ि", "ी", "ु", "ू", "े", "ै", "ो", "ौ", "ं", "ः"];

  function toMarathiDigits(numStr) {
    const map = {'0':'०','1':'१','2':'२','3':'३','4':'४','5':'५','6':'६','7':'७','8':'८','9':'९'};
    return numStr.split('').map(ch => map[ch] || ch).join('');
  }

  function getNumberPics(n) {
    const numEmojis = ['⭐', '🎈', '🍬', '🧸', '🌟', '🍓', '🏀', '🌸', '🦋', '🚂'];
    const showCount = Math.min(n, 5);
    return numEmojis[n % numEmojis.length].repeat(showCount);
  }

  const marathiNumData = Array.from({length: 100}, (_, i) => {
    const n = i + 1;
    const mDigit = toMarathiDigits(String(n));
    return {
      char: mDigit,
      word: `अंक ${mDigit}`,
      pic: getNumberPics(n),
      speech: mDigit,
      lang: 'mr-IN'
    };
  });

  const engNumData = Array.from({length: 100}, (_, i) => {
    const n = i + 1;
    return {
      char: String(n),
      word: `Number ${n}`,
      pic: getNumberPics(n),
      speech: String(n),
      lang: 'en-IN'
    };
  });

  function buildBarakhadiList(consonant) {
    const [word, pic] = vyanjanPics[consonant] || [consonant, '✏️'];
    return matras.map(m => {
      const ch = consonant + m;
      return {
        char: ch,
        word: `${ch} (${word})`,
        pic: pic,
        speech: ch,
        lang: 'mr-IN'
      };
    });
  }

  let currentMode = 'abcd';
  let currentConsonant = 'क';
  let currentList = abcdData;
  let currentIndex = 0;
  let strokeColor = '#FF3B30';
  let isDrawing = false;

  const barakhadiBar = document.getElementById('barakhadi-bar');
  vyanjanList.forEach((v, idx) => {
    const btn = document.createElement('button');
    btn.className = 'consonant-btn' + (idx === 0 ? ' active' : '');
    btn.innerText = v;
    btn.onclick = () => {
      document.querySelectorAll('.consonant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentConsonant = v;
      currentList = buildBarakhadiList(v);
      currentIndex = 0;
      loadChar();
    };
    barakhadiBar.appendChild(btn);
  });

  function resizeCanvas() {
    const main = document.querySelector('main');
    canvas.width = Math.max(200, main.clientWidth - 32);
    canvas.height = Math.max(200, main.clientHeight - 24);
    drawGuide();
  }
  window.addEventListener('resize', resizeCanvas);

  function setMode(mode, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = mode;
    currentIndex = 0;

    if (mode === 'barakhadi') {
      barakhadiBar.style.display = 'block';
      currentList = buildBarakhadiList(currentConsonant);
    } else {
      barakhadiBar.style.display = 'none';
      if (mode === 'abcd') currentList = abcdData;
      if (mode === 'swar') currentList = swarData;
      if (mode === 'marathi_num') currentList = marathiNumData;
      if (mode === 'eng_num') currentList = engNumData;
    }
    resizeCanvas();
    loadChar();
  }

  function setColor(color, el) {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
    strokeColor = color;
  }

  function updateBanner() {
    const item = currentList[currentIndex];
    document.getElementById('info-pic').innerText = item.pic;
    if (currentMode === 'abcd') {
      document.getElementById('info-text').innerText = `${item.char} for ${item.word}`;
    } else {
      document.getElementById('info-text').innerText = item.word;
    }
  }

  function drawGuide() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const item = currentList[currentIndex];
    const fontSize = Math.min(canvas.width, canvas.height) * 0.58;

    ctx.save();
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#F2F2F2';
    ctx.fillText(item.char, canvas.width / 2, canvas.height / 2 + 12);

    ctx.strokeStyle = '#999999';
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 12]);
    ctx.strokeText(item.char, canvas.width / 2, canvas.height / 2 + 12);
    ctx.restore();
  }

  function speakCurrent() {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const item = currentList[currentIndex];
    let textToSpeak = item.speech;
    let lang = 'mr-IN';

    if (currentMode === 'abcd') {
      textToSpeak = `${item.char} for ${item.word}`;
      lang = 'en-IN';
    } else if (currentMode === 'eng_num') {
      lang = 'en-IN';
    } else {
      lang = 'mr-IN';
    }

    const utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = lang;
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }

  function loadChar() {
    updateBanner();
    drawGuide();
    speakCurrent();
  }

  function clearCanvas() {
    drawGuide();
  }

  function prevItem() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    loadChar();
  }

  function nextItem() {
    currentIndex = (currentIndex + 1) % currentList.length;
    loadChar();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function moveDraw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = 22;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = strokeColor;
    ctx.setLineDash([]);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function endDraw() {
    isDrawing = false;
    ctx.closePath();
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);

  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', moveDraw, {passive: false});
  window.addEventListener('touchend', endDraw);

  updateBanner();
  resizeCanvas();

  document.body.addEventListener('touchstart', function initSpeech() {
    speakCurrent();
    document.body.removeEventListener('touchstart', initSpeech);
  }, {once: true});
</script>

</body>
</html>
