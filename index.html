<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>शिवशंभु पुजारी - मुलांची पाटी</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #FFF9E6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #FF6B6B;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #FFE66D;
      border: none;
      padding: 8px 13px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4ECDC4;
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
    }
    .color-dot.selected {
      transform: scale(1.2);
      border-color: #333;
    }
    .action-btn {
      background: white;
      border: none;
      padding: 7px 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #barakhadi-bar {
      display: none;
      flex-shrink: 0;
      background: #FFE66D;
      padding: 8px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      min-height: 52px;
      align-items: center;
      border-bottom: 2px solid #F2D14B;
    }
    .consonant-btn {
      display: inline-block;
      flex-shrink: 0;
      background: white;
      border: 2px solid #FF6B6B;
      border-radius: 10px;
      padding: 6px 13px;
      font-size: 19px;
      font-weight: bold;
      margin-right: 6px;
      color: #222;
      cursor: pointer;
    }
    .consonant-btn.active {
      background: #FF6B6B;
      color: white;
    }
    #info-banner {
      flex-shrink: 0;
      background: #FFFFFF;
      margin: 8px 16px 0;
      padding: 8px 16px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      min-height: 64px;
    }
    #info-pic {
      font-size: 42px;
      line-height: 1;
    }
    #info-text {
      font-size: 26px;
      font-weight: bold;
      color: #222;
    }
    main {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px 14px;
      min-height: 0;
    }
    canvas {
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #4ECDC4;
      color: white;
      border: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 10;
    }
    #prev-btn { left: 24px; }
    #next-btn { right: 24px; }

    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #FF6B6B 0%, #FFE66D 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 24px;
      transition: opacity 0.35s ease;
      touch-action: manipulation;
    }
    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash-title {
      font-size: 46px;
      font-weight: bold;
      color: #FFFFFF;
      text-shadow: 0 3px 10px rgba(0,0,0,0.25);
      margin: 0;
    }
  </style>
</head>
<body>

<div id="splash-screen" onclick="dismissSplash()" ontouchstart="dismissSplash()">
  <h1 id="splash-title">शिवशंभु पुजारी</h1>
</div>

<header>
  <div class="tabs">
    <button id="tab-ABCD" class="tab-btn active" onclick="setMode('ABCD', this)">ABCD</button>
    <button id="tab-abcd" class="tab-btn" onclick="setMode('abcd', this)">abcd</button>
    <button id="tab-swar" class="tab-btn" onclick="setMode('swar', this)">स्वर</button>
    <button id="tab-barakhadi" class="tab-btn" onclick="setMode('barakhadi', this)">बाराखडी</button>
    <button id="tab-marathi-num" class="tab-btn" onclick="setMode('marathi_num', this)">१-१००</button>
    <button id="tab-eng-num" class="tab-btn" onclick="setMode('eng_num', this)">1-100</button>
  </div>
  <div class="tools">
    <div class="color-dot selected" style="background: #FF3B30;" onclick="setColor('#FF3B30', this)"></div>
    <div class="color-dot" style="background: #007AFF;" onclick="setColor('#007AFF', this)"></div>
    <div class="color-dot" style="background: #34C759;" onclick="setColor('#34C759', this)"></div>
    <div class="color-dot" style="background: #AF52DE;" onclick="setColor('#AF52DE', this)"></div>
    <button class="action-btn" onclick="clearCanvas()">पुसा</button>
  </div>
</header>

<div id="barakhadi-bar"></div>

<div id="info-banner" onclick="speakCurrent()">
  <span id="info-pic">🍎</span>
  <span id="info-text">A for Apple</span>
</div>

<main>
  <button id="prev-btn" class="nav-btn" onclick="prevItem()">&#8249;</button>
  <canvas id="board"></canvas>
  <button id="next-btn" class="nav-btn" onclick="nextItem()">&#8250;</button>
</main>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  const baseAbcd = [
    { upper: 'A', lower: 'a', word: 'Apple', pic: '🍎', speech: 'A for Apple' },
    { upper: 'B', lower: 'b', word: 'Ball', pic: '⚽', speech: 'B for Ball' },
    { upper: 'C', lower: 'c', word: 'Cat', pic: '🐱', speech: 'C for Cat' },
    { upper: 'D', lower: 'd', word: 'Dog', pic: '🐶', speech: 'D for Dog' },
    { upper: 'E', lower: 'e', word: 'Elephant', pic: '🐘', speech: 'E for Elephant' },
    { upper: 'F', lower: 'f', word: 'Fish', pic: '🐟', speech: 'F for Fish' },
    { upper: 'G', lower: 'g', word: 'Grapes', pic: '🍇', speech: 'G for Grapes' },
    { upper: 'H', lower: 'h', word: 'Hen', pic: '🐔', speech: 'H for Hen' },
    { upper: 'I', lower: 'i', word: 'Ice cream', pic: '🍨', speech: 'I for Ice cream' },
    { upper: 'J', lower: 'j', word: 'Joker', pic: '🃏', speech: 'J for Joker' },
    { upper: 'K', lower: 'k', word: 'Kite', pic: '🪁', speech: 'K for Kite' },
    { upper: 'L', lower: 'l', word: 'Lion', pic: '🦁', speech: 'L for Lion' },
    { upper: 'M', lower: 'm', word: 'Mango', pic: '🥭', speech: 'M for Mango' },
    { upper: 'N', lower: 'n', word: 'Nest', pic: '🪺', speech: 'N for Nest' },
    { upper: 'O', lower: 'o', word: 'Orange', pic: '🍊', speech: 'O for Orange' },
    { upper: 'P', lower: 'p', word: 'Parrot', pic: '🦜', speech: 'P for Parrot' },
    { upper: 'Q', lower: 'q', word: 'Queen', pic: '👑', speech: 'Q for Queen' },
    { upper: 'R', lower: 'r', word: 'Rabbit', pic: '🐰', speech: 'R for Rabbit' },
    { upper: 'S', lower: 's', word: 'Sun', pic: '☀️', speech: 'S for Sun' },
    { upper: 'T', lower: 't', word: 'Tiger', pic: '🐯', speech: 'T for Tiger' },
    { upper: 'U', lower: 'u', word: 'Umbrella', pic: '☂️', speech: 'U for Umbrella' },
    { upper: 'V', lower: 'v', word: 'Van', pic: '🚐', speech: 'V for Van' },
    { upper: 'W', lower: 'w', word: 'Watch', pic: '⌚', speech: 'W for Watch' },
    { upper: 'X', lower: 'x', word: 'Xylophone', pic: '🎹', speech: 'X for Xylophone' },
    { upper: 'Y', lower: 'y', word: 'Yak', pic: '🐂', speech: 'Y for Yak' },
    { upper: 'Z', lower: 'z', word: 'Zebra', pic: '🦓', speech: 'Z for Zebra' }
  ];

  const upperAbcdData = baseAbcd.map(item => ({
    char: item.upper,
    label: `${item.upper} for ${item.word}`,
    pic: item.pic,
    speech: item.speech
  }));

  const lowerAbcdData = baseAbcd.map(item => ({
    char: item.lower,
    label: `${item.lower} for ${item.word}`,
    pic: item.pic,
    speech: item.speech
  }));

  const swarData = [
    { char: 'अ', word: 'अननस', pic: '🍍', speechList: ['अ', 'अ अननस'] },
    { char: 'आ', word: 'आई', pic: '👩', speechList: ['आ', 'आ आई'] },
    { char: 'इ', word: 'इमारत', pic: '🏢', speechList: ['इ', 'इ इमारत'] },
    { char: 'ई', word: 'ईडलिंबू', pic: '🍋', speechList: ['ई', 'ई ईडलिंबू'] },
    { char: 'उ', word: 'उंट', pic: '🐪', speechList: ['उ', 'उ उंट'] },
    { char: 'ऊ', word: 'ऊस', pic: '🎋', speechList: ['ऊ', 'ऊ ऊस'] },
    { char: 'ऋ', word: 'ऋषी', pic: '🧘', speechList: ['ऋ', 'ऋ ऋषी'] },
    { char: 'ए', word: 'एडका', pic: '🐐', speechList: ['ए', 'ए एडका'] },
    { char: 'ऐ', word: 'ऐरण', pic: '🔨', speechList: ['ऐ', 'ऐ ऐरण'] },
    { char: 'ओ', word: 'ओठा', pic: '👄', speechList: ['ओ', 'ओ ओठा'] },
    { char: 'औ', word: 'औषध', pic: '💊', speechList: ['औ', 'औ औषध'] },
    { char: 'अं', word: 'अंगठी', pic: '💍', speechList: ['अं', 'अं अंगठी'] },
    { char: 'अः', word: 'अः', pic: '✨', speechList: ['अः', 'अः'] }
  ];

  const vyanjanPics = {
    'क': ['कमळ', '🪷'], 'ख': ['खडू', '🖍️'], 'ग': ['गणपती', '🐘'], 'घ': ['घर', '🏠'],
    'च': ['चमचा', '🥄'], 'छ': ['छत्री', '☂️'], 'ज': ['जहाज', '🚢'], 'झ': ['झेंडा', '🚩'],
    'ट': ['टोपली', '🧺'], 'ठ': ['ठसा', '👣'], 'ड': ['डमरू', '🥁'], 'ढ': ['ढग', '☁️'],
    'ण': ['बाण', '🏹'], 'त': ['तलवार', '⚔️'], 'थ': ['थवा', '🐦'], 'द': ['दप्तर', '🎒'],
    'ध': ['धनुष्य', '🏹'], 'न': ['नळ', '🚰'], 'प': ['पतंग', '🪁'], 'फ': ['फणस', '🍈'],
    'ब': ['बदक', '🦆'], 'भ': ['भोपळा', '🎃'], 'म': ['मगर', '🐊'], 'य': ['यज्ञ', '🔥'],
    'र': ['रथ', '🛒'], 'ल': ['लसूण', '🧄'], 'व': ['वडा', '🍩'], 'श': ['शंख', '🐚'],
    'ष': ['षटकोन', '🔷'], 'स': ['ससा', '🐇'], 'ह': ['हत्ती', '🐘'], 'ळ': ['बाळ', '👶'],
    'क्ष': ['क्षत्रिय', '🛡️'], 'ज्ञ': ['ज्ञान', '📚']
  };

  const vyanjanList = Object.keys(vyanjanPics);
  const matras = ["", "ा", "ि", "ी", "ु", "ू", "े", "ै", "ो", "ौ", "ं", "ः"];

  const marathiNumberWords = [
    "एक","दोन","तीन","चार","पाच","सहा","सात","आठ","नऊ","दहा",
    "अकरा","बारा","तेरा","चौदा","पंधरा","सोळा","सतरा","अठरा","एकोणीस","वीस",
    "एकवीस","बावीस","तेवीस","चोवीस","पंचवीस","सव्वीस","सत्तावीस","अठ्ठावीस","एकोणतीस","तीस",
    "एकतीस","बत्तीस","तेहतीस","चौतीस","पस्तीस","छत्तीस","सदतीस","अडतीस","एकोणचाळीस","चाळीस",
    "एक्केचाळीस","बेचाळीस","त्रेचाळीस","चव्वेचाळीस","पंचेचाळीस","सेहेचाळीस","सत्तेचाळीस","अठ्ठेचाळीस","एकोणपन्नास","पन्नास",
    "एकावन्न","बावन्न","त्रेपन्न","चोपन्न","पंचावन्न","छप्पन्न","सत्तावन्न","अठ्ठावन्न","एकोणसाठ","साठ",
    "एकसष्ठ","बासष्ठ","त्रेसष्ठ","चौसष्ठ","पासष्ठ","छसष्ठ","सदुसष्ठ","अडुसष्ठ","एकोणसत्तर","सत्तर",
    "एक्काहत्तर","बाहत्तर","त्र्याहत्तर","चौर्‍याहत्तर","पंच्याहत्तर","शहात्तर","सत्त्याहत्तर","अठ्ठ्याहत्तर","एकोणऐंशी","ऐंशी",
    "एक्याऐंशी","ब्याऐंशी","त्र्याऐंशी","चौऱ्याऐंशी","पंच्याऐंशी","शहाऐंशी","सत्त्याऐंशी","अठ्ठ्याऐंशी","एकोणनव्वद","नव्वद",
    "एक्याण्णव","ब्याण्णव","त्र्याण्णव","चौऱ्याण्णव","पंच्याण्णव","शहाण्णव","सत्त्याण्णव","अठ्ठ्याण्णव","नव्याण्णव","शंभर"
  ];

  function toMarathiDigits(numStr) {
    const map = {'0':'०','1':'१','2':'२','3':'३','4':'४','5':'५','6':'६','7':'७','8':'८','9':'९'};
    return numStr.split('').map(ch => map[ch] || ch).join('');
  }

  function getNumberPics(n) {
    const numEmojis = ['⭐', '🎈', '🍬', '🧸', '🌟', '🍓', '🏀', '🌸', '🦋', '🚂'];
    const showCount = Math.min(n, 5);
    return numEmojis[n % numEmojis.length].repeat(showCount);
  }

  const marathiNumData = Array.from({length: 100}, (_, i) => {
    const n = i + 1;
    const mDigit = toMarathiDigits(String(n));
    const mWord = marathiNumberWords[i];
    return {
      char: mDigit,
      word: `${mDigit} (${mWord})`,
      pic: getNumberPics(n),
      speech: mWord,
      lang: 'mr-IN'
    };
  });

  const engNumData = Array.from({length: 100}, (_, i) => {
    const n = i + 1;
    return {
      char: String(n),
      word: `Number ${n}`,
      pic: getNumberPics(n),
      speech: String(n),
      lang: 'en-IN'
    };
  });

  function buildBarakhadiList(consonant) {
    const [word, pic] = vyanjanPics[consonant] || [consonant, '✏️'];
    return matras.map(m => {
      const ch = consonant + m;
      return {
        char: ch,
        word: `${ch} (${word})`,
        pic: pic,
        speech: ch,
        lang: 'mr-IN'
      };
    });
  }

  let currentMode = 'ABCD';
  let currentConsonant = 'क';
  let currentList = upperAbcdData;
  let currentIndex = 0;
  let strokeColor = '#FF3B30';
  let isDrawing = false;

  const barakhadiBar = document.getElementById('barakhadi-bar');
  vyanjanList.forEach((v, idx) => {
    const btn = document.createElement('button');
    btn.className = 'consonant-btn' + (idx === 0 ? ' active' : '');
    btn.innerText = v;
    btn.onclick = () => {
      document.querySelectorAll('.consonant-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentConsonant = v;
      currentList = buildBarakhadiList(v);
      currentIndex = 0;
      loadChar();
    };
    barakhadiBar.appendChild(btn);
  });

  function resizeCanvas() {
    const main = document.querySelector('main');
    canvas.width = Math.max(200, main.clientWidth - 32);
    canvas.height = Math.max(200, main.clientHeight - 24);
    drawGuide();
  }
  window.addEventListener('resize', resizeCanvas);

  function setMode(mode, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    currentMode = mode;
    currentIndex = 0;

    if (mode === 'barakhadi') {
      barakhadiBar.style.display = 'flex';
      currentList = buildBarakhadiList(currentConsonant);
    } else {
      barakhadiBar.style.display = 'none';
      if (mode === 'ABCD') currentList = upperAbcdData;
      if (mode === 'abcd') currentList = lowerAbcdData;
      if (mode === 'swar') currentList = swarData;
      if (mode === 'marathi_num') currentList = marathiNumData;
      if (mode === 'eng_num') currentList = engNumData;
    }
    resizeCanvas();
    loadChar();
  }

  function setColor(color, el) {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
    strokeColor = color;
  }

  function updateBanner() {
    const item = currentList[currentIndex];
    document.getElementById('info-pic').innerText = item.pic;
    if (currentMode === 'ABCD' || currentMode === 'abcd') {
      document.getElementById('info-text').innerText = item.label;
    } else if (currentMode === 'swar') {
      document.getElementById('info-text').innerText = `${item.char}, ${item.char} ${item.word}`;
    } else {
      document.getElementById('info-text').innerText = item.word;
    }
  }

  function drawGuide() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const item = currentList[currentIndex];
    const fontSize = Math.min(canvas.width, canvas.height) * 0.58;

    ctx.save();
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#F2F2F2';
    ctx.fillText(item.char, canvas.width / 2, canvas.height / 2 + 12);

    ctx.strokeStyle = '#999999';
    ctx.lineWidth = 4;
    ctx.setLineDash([12, 12]);
    ctx.strokeText(item.char, canvas.width / 2, canvas.height / 2 + 12);
    ctx.restore();
  }

  function pickVoice(lang) {
    try {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;

      const targetLang = (lang || 'mr-IN').toLowerCase();
      const femaleKeywords = ['female', 'veena', 'riya', 'neerja', 'aditi', 'lekha', 'samantha', 'victoria', 'karen', 'moira', 'tessa', 'fiona', 'zira'];

      const isFemale = (v) => {
        const n = (v.name || '').toLowerCase();
        return femaleKeywords.some(k => n.includes(k));
      };

      if (targetLang.startsWith('en')) {
        const enInVoices = voices.filter(v => (v.lang || '').toLowerCase().includes('en-in') || (v.lang || '').toLowerCase().includes('en_in'));
        if (enInVoices.length) return enInVoices.find(isFemale) || enInVoices[0];
        const anyEnVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
        if (anyEnVoices.length) return anyEnVoices.find(isFemale) || anyEnVoices[0];
      }

      const prefix = targetLang.slice(0, 2);
      const matchedLangVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith(prefix));
      if (matchedLangVoices.length) return matchedLangVoices.find(isFemale) || matchedLangVoices[0];
    } catch (e) {}
    return null;
  }

  function speakSequence(texts, lang) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const chosenLang = lang || 'mr-IN';
      const voice = pickVoice(chosenLang);

      texts.forEach((txt) => {
        const utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = chosenLang;
        if (voice) utterance.voice = voice;
        utterance.pitch = chosenLang.toLowerCase().startsWith('en') ? 1.15 : 1.0;
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      });
    } catch (e) {}
  }

  function speakText(text, lang) {
    speakSequence([text], lang);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      try { window.speechSynthesis.getVoices(); } catch (e) {}
    };
  }

  function speakCurrent() {
    const item = currentList[currentIndex];
    if (currentMode === 'swar' && Array.isArray(item.speechList)) {
      speakSequence(item.speechList, 'mr-IN');
      return;
    }

    let textToSpeak = item.speech;
    let lang = 'mr-IN';

    if (currentMode === 'ABCD' || currentMode === 'abcd' || currentMode === 'eng_num') {
      lang = 'en-IN';
    } else {
      lang = 'mr-IN';
    }
    speakText(textToSpeak, lang);
  }

  function loadChar() {
    updateBanner();
    drawGuide();
    speakCurrent();
  }

  function clearCanvas() {
    drawGuide();
  }

  function prevItem() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    loadChar();
  }

  function nextItem() {
    currentIndex = (currentIndex + 1) % currentList.length;
    loadChar();
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function moveDraw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.lineWidth = 22;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = strokeColor;
    ctx.setLineDash([]);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function endDraw() {
    isDrawing = false;
    ctx.closePath();
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);

  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', moveDraw, {passive: false});
  window.addEventListener('touchend', endDraw);

  let splashDismissed = false;
  function dismissSplash() {
    if (splashDismissed) return;
    splashDismissed = true;
    const splash = document.getElementById('splash-screen');
    splash.classList.add('fade-out');
    setTimeout(() => {
      splash.style.display = 'none';
      resizeCanvas();
      speakCurrent();
    }, 350);
  }

  updateBanner();
  resizeCanvas();
  speakText('शिवशंभु पुजारी', 'mr-IN');

  setTimeout(() => {
    dismissSplash();
  }, 1800);
</script>

</body>
</html>
